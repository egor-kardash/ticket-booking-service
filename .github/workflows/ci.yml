name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build -mod=readonly ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -shuffle=on -count=1 -timeout=2m ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          args: --timeout=5m --build-tags=integration

      - name: Check import grouping
        run: golangci-lint fmt --diff

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: booking_test
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U booking -d booking_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5433"
      TEST_POSTGRES_USER: booking
      TEST_POSTGRES_PASSWORD: booking
      TEST_POSTGRES_DB: booking_test
      TEST_POSTGRES_SSLMODE: disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # make test-integration поднимает compose-контейнер db и конфликтует
      # с service-контейнером выше, поэтому миграции применяются напрямую.
      - name: Apply migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/migrations:/migrations" \
            migrate/migrate:v4.20.1 \
            -path /migrations \
            -database "postgres://booking:booking@127.0.0.1:5433/booking_test?sslmode=disable" \
            up

      - name: Vet with integration tag
        run: go vet -tags integration ./...

      - name: Integration tests
        run: go test -race -shuffle=on -count=1 -timeout=5m -tags integration ./...
