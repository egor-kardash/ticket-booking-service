openapi: 3.2.1

info:
  title: Ticket Booking API
  version: 0.1.0
  description: |
    REST API для бронирования мест на события.

    Базовый путь: `/api/v1`. Аутентификация: `Authorization: Bearer <jwt>`.
    Тело запросов: JSON, не более 1 MiB, `Content-Type: application/json`.
    Ошибки: `{"error":{"code":"snake_case","message":"...","fields":{...}}}`.

servers:
  - url: http://localhost:8080

tags:
  - name: auth
    description: Регистрация, вход и текущий пользователь
  - name: health
    description: Проверки живости и готовности
  - name: events
    description: Каталог событий и мест (read-only, без аутентификации)

paths:
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: Liveness-проверка
      description: Процесс жив. БД не используется.
      security: []
      responses:
        '200':
          description: Процесс жив
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                ok:
                  value:
                    status: ok

  /readyz:
    get:
      tags: [health]
      operationId: readyz
      summary: Readiness-проверка
      description: Проверяет доступность PostgreSQL с таймаутом 2 секунды.
      security: []
      responses:
        '200':
          description: Сервис готов принимать запросы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                ready:
                  value:
                    status: ready
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: Зарегистрировать пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              register:
                value:
                  email: user@example.com
                  password: correct horse battery staple
      responses:
        '201':
          description: Пользователь создан
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                created:
                  value:
                    id: 1
                    email: user@example.com
        '400':
          $ref: '#/components/responses/RegisterBadRequest'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: loginUser
      summary: Войти и получить JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login:
                value:
                  email: user@example.com
                  password: correct horse battery staple
      responses:
        '200':
          description: Токен выдан
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                authenticated:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    expires_in: 900
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Получить текущего пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Текущий пользователь
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                current:
                  value:
                    id: 1
                    email: user@example.com
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Список событий
      description: |
        Публичный. Сортировка: `starts_at ASC, id ASC`.

        Keyset-пагинация: `limit` и непрозрачный `cursor`. Клиент не должен
        разбирать содержимое курсора — формат внутренний и может измениться.
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            Размер страницы, 1..100. Нечисловое значение или выход за границы
            даёт `400 invalid_limit`.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: |
            Непрозрачный курсор следующей страницы, полученный из `next_cursor`.
            Отсутствует или пуст — первая страница.

            Внутри base64url(`<unix_micros>:<id>`). Битый курсор или время вне
            окна 1970-01-01..2100-01-01 даёт `400 invalid_cursor`.
          schema:
            type: string
          example: MTc2NzIyMjAwMDAwMDAwMDoxMg
      responses:
        '200':
          description: Страница событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
              examples:
                page:
                  value:
                    items:
                      - id: 1
                        title: Seed Concert
                        venue: Seed Arena
                        city: Moscow
                        starts_at: '2027-01-01T16:00:00Z'
                    next_cursor: MTc2NzIyMjAwMDAwMDAwMDoxMg
                last_page:
                  value:
                    items: []
        '400':
          $ref: '#/components/responses/InvalidPagination'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/events/{id}:
    get:
      tags: [events]
      operationId: getEvent
      summary: Событие по идентификатору
      description: Публичный. Отдаёт событие вместе со счётчиками мест.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '200':
          description: Событие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetails'
              examples:
                found:
                  value:
                    id: 1
                    title: Seed Concert
                    venue: Seed Arena
                    city: Moscow
                    starts_at: '2027-01-01T16:00:00Z'
                    seats_total: 100
                    seats_available: 87
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/events/{id}/seats:
    get:
      tags: [events]
      operationId: listEventSeats
      summary: Места события
      description: |
        Публичный. Пагинации нет: у события около 100 мест, ответ отдаётся целиком.

        Порядок стабилен: `section` и `row` — лексикографически (это строки),
        `seat` — сначала числовое значение для чисто цифровых меток, затем
        нецифровые (`A1`, `12A`), затем `id`. Поэтому `2` идёт раньше `10`,
        а `10` — раньше `A1`.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '200':
          description: Все места события
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSeatList'
              examples:
                seats:
                  value:
                    items:
                      - id: 10
                        section: A
                        row: '1'
                        seat: '1'
                        tier: standard
                        price_cents: 250000
                        status: available
                      - id: 11
                        section: A
                        row: '1'
                        seat: '2'
                        tier: vip
                        price_cents: 500000
                        status: held
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Authorization: Bearer <jwt>. Схема сравнения case-insensitive,
        допускается несколько пробелов между схемой и токеном.

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          x-maxLengthBytes: 254
          description: >
            Тримится и приводится к нижнему регистру.
            В реализации ограничение — 254 байта; JSON Schema считает символы.
        password:
          type: string
          minLength: 8
          maxLength: 72
          x-maxLengthBytes: 72
          description: >
            Минимум 8 символов. Максимум 72 байта — ограничение bcrypt;
            JSON Schema считает maxLength в символах, поэтому для не-ASCII
            паролей фактический лимит строже.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    User:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email

    AuthResponse:
      type: object
      additionalProperties: false
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
          description: |
            JWT для заголовка Authorization: Bearer.
        expires_in:
          type: integer
          format: int64
          description: Срок жизни токена в секундах.

    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string

    EventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Всегда массив; пустая страница — `[]`, не `null`.
          items:
            $ref: '#/components/schemas/EventListItem'
        next_cursor:
          type: string
          description: |
            Курсор следующей страницы. Поле отсутствует на последней странице.

    EventListItem:
      type: object
      additionalProperties: false
      required: [id, title, venue, city, starts_at]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 200
        venue:
          type: string
          maxLength: 120
          description: Название площадки.
        city:
          type: string
          maxLength: 120
        starts_at:
          type: string
          format: date-time
          description: Время начала в UTC, RFC3339.

    EventDetails:
      type: object
      additionalProperties: false
      required: [id, title, venue, city, starts_at, seats_total, seats_available]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 200
        venue:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 120
        starts_at:
          type: string
          format: date-time
          description: Время начала в UTC, RFC3339.
        seats_total:
          type: integer
          format: int64
          minimum: 0
          description: Всего мест у события.
        seats_available:
          type: integer
          format: int64
          minimum: 0
          description: Мест в статусе `available`.

    EventSeatList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Всегда массив; отсутствие мест — `[]`, не `null`.
          items:
            $ref: '#/components/schemas/EventSeat'

    EventSeat:
      type: object
      additionalProperties: false
      required: [id, section, row, seat, tier, price_cents, status]
      properties:
        id:
          type: integer
          format: int64
          description: |
            Идентификатор места на событии (`event_seats.id`), а не физического
            места площадки. Используется в hold/order.
        section:
          type: string
          maxLength: 10
        row:
          type: string
          maxLength: 10
          description: Метка ряда; строка, а не число.
        seat:
          type: string
          maxLength: 10
          description: Метка места; строка, а не число.
        tier:
          type: string
          maxLength: 20
        price_cents:
          type: integer
          format: int64
          minimum: 1
          description: Цена в копейках.
        status:
          $ref: '#/components/schemas/EventSeatStatus'

    EventSeatStatus:
      type: string
      enum: [available, held, sold]
      description: |
        `held` и `sold` для клиента одинаково недоступны, но различаются
        для отладки.

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Машиночитаемый код ошибки.
            message:
              type: string
              description: Человекочитаемое сообщение.
            fields:
              type: object
              additionalProperties:
                type: string
              description: Детали валидации по полям; только для validation_failed.

  parameters:
    EventID:
      name: id
      in: path
      required: true
      description: |
        Идентификатор события. Нечисловое значение или значение ≤ 0 даёт
        `400 validation_failed` с `fields.id`.
      schema:
        type: integer
        format: int64
        minimum: 1

  headers:
    Location:
      description: URL созданного ресурса.
      schema:
        type: string
      example: /api/v1/auth/me

    CacheControl:
      description: Запрет кеширования ответов auth-слоя.
      schema:
        type: string
      example: no-store

    Pragma:
      description: Совместимость с HTTP/1.0.
      schema:
        type: string
      example: no-cache

    WWWAuthenticate:
      description: Bearer challenge для 401.
      schema:
        type: string
      examples:
        missing:
          value: Bearer
        invalid:
          value: 'Bearer error="invalid_token"'

  responses:
    RegisterBadRequest:
      description: invalid_json (битый JSON, null, массив, лишние значения) или validation_failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_json:
              value:
                error:
                  code: invalid_json
                  message: request body must be a single JSON object
            validation_failed:
              value:
                error:
                  code: validation_failed
                  message: request validation failed
                  fields:
                    email: must be a valid email
                    password: must be at least 8 characters

    InvalidJSON:
      description: Тело не является одним JSON-объектом.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_json
              message: request body must be a single JSON object

    EmailTaken:
      description: Email уже зарегистрирован.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: email_taken
              message: email is already taken

    InvalidCredentials:
      description: Неверная пара email/пароль. Одинаковый ответ для неизвестного email и неверного пароля.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_credentials
              message: incorrect email or password

    Unauthorized:
      description: Нет, битый или просроченный JWT.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: invalid or expired token

    NotFound:
      description: Ресурс не найден или недоступен текущему пользователю.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: resource not found

    TooLarge:
      description: Тело запроса больше 1 MiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: request_too_large
              message: request body is too large

    UnsupportedMediaType:
      description: Content-Type не application/json (или application/*+json).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unsupported_media_type
              message: content type must be application/json

    InternalError:
      description: Внутренняя ошибка. Детали не раскрываются.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: internal server error

    ServiceUnavailable:
      description: Таймаут операции с БД.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: service_unavailable
              message: service unavailable

    DatabaseUnavailable:
      description: Readiness-проверка не смогла достучаться до PostgreSQL.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: database_unavailable
              message: database is not reachable

    InvalidPagination:
      description: Некорректные параметры пагинации (`limit` или `cursor`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_limit:
              value:
                error:
                  code: invalid_limit
                  message: invalid events limit
            invalid_cursor:
              value:
                error:
                  code: invalid_cursor
                  message: invalid pagination cursor

    ValidationFailed:
      description: Неверное значение параметра пути или запроса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_event_id:
              value:
                error:
                  code: validation_failed
                  message: request validation failed
                  fields:
                    id: must be positive
